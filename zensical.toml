[project]
site_name = "1Password Find Item"
site_url = "https://sbfeinstein.github.io/op_find_item/"
repo_url = "https://github.com/sbfeinstein/op_find_item"
repo_name = "sbfeinstein/op_find_item"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Authentication" = "authentication.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
