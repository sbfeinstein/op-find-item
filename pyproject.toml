[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "op-find-item"
version = "0.1.0"
description = "1Password Find Item is a CLI for searching all vaults, items and fields for a given string"
readme = "README.md"
authors = [
  {name = "Scott Feinstein", email = "Scott_Feinstein@yahoo.com"}
]
maintainers = [
  {name = "Scott Feinstein", email = "Scott_Feinstein@yahoo.com"}
]
classifiers = [
    "Typing :: Typed",
    # TODO: Add additional classifiers as needed
]
license = {text = "MIT"}
dependencies = [
  "typer>=0.25.0",
  "rich>=14.3.4",
  "onepassword-sdk>=0.4.2",
  "onepassword>=0.4.1",
]
requires-python = ">=3.11"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio"
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/sbfeinstein/op_find_item/issues"
changelog = "https://github.com/sbfeinstein/op_find_item/releases"
documentation = "https://sbfeinstein.github.io/op_find_item/"
homepage = "https://github.com/sbfeinstein/op_find_item"

[project.scripts]
op-find-item = "op_find_item.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = ["dev"]
